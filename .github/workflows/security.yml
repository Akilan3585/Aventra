name: Security Guardian

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ---------------------------------
  # 1. Secret scanning
  # ---------------------------------
  gitleaks:
    name: Gitleaks - Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------
  # 2. Semgrep SAST
  # ---------------------------------
  semgrep:
    name: Semgrep - SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run Semgrep
        run: semgrep scan --config auto --error --exclude node_modules --exclude .next

  # ---------------------------------
  # 3. CodeQL
  # ---------------------------------
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Run CodeQL
        uses: github/codeql-action/analyze@v3

  # ---------------------------------
  # 4. Dependency security
  # ---------------------------------
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  # ---------------------------------
  # 5. Application security tests
  # ---------------------------------
  security-tests:
    name: Application security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Authorization matrix, route gating, role navigation, and approval
      # rules. These run without credentials: the app treats REPLACE_ME
      # values as unconfigured, so no Supabase or Clerk secrets are needed.
      - name: Run security tests
        run: pnpm test:security

  # ---------------------------------
  # 6. Final security gate
  # ---------------------------------
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, codeql, dependencies, security-tests]
    if: always()
    steps:
      - name: Evaluate security checks
        env:
          GITLEAKS: ${{ needs.gitleaks.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          CODEQL: ${{ needs.codeql.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          SECURITY_TESTS: ${{ needs.security-tests.result }}
        run: |
          echo "Gitleaks:       $GITLEAKS"
          echo "Semgrep:        $SEMGREP"
          echo "CodeQL:         $CODEQL"
          echo "Dependencies:   $DEPENDENCIES"
          echo "Security tests: $SECURITY_TESTS"

          failed=0
          for result in "$GITLEAKS" "$SEMGREP" "$CODEQL" "$DEPENDENCIES" "$SECURITY_TESTS"; do
            if [ "$result" != "success" ]; then failed=1; fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "SECURITY GATE FAILED"
            exit 1
          fi
          echo "SECURITY GATE PASSED"
